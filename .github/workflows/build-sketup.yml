name: Build SKET-UP APK

on:
  workflow_dispatch:
  push:
    branches: [integracao-sket-up]
    paths:
      - '.github/workflows/build-sketup.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sket-up-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
